<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script>
    // make activities available globally for the signup handler
    let activitiesData = {};

    async function fetchActivities() {
      const res = await fetch('/activities');
      if (!res.ok) {
        showMessage('Failed to load activities', 'error');
        return {};
      }
      return await res.json();
    }

    function createActivityCard(name, data) {
      const card = document.createElement('div');
      card.className = 'activity-card';
      card.id = `activity-${cssSafeId(name)}`;

      const title = document.createElement('h4');
      title.textContent = name;
      card.appendChild(title);

      const desc = document.createElement('p');
      desc.textContent = data.description;
      card.appendChild(desc);

      const sched = document.createElement('p');
      sched.innerHTML = `<strong>Schedule:</strong> ${data.schedule}`;
      card.appendChild(sched);

      // add an id to the capacity paragraph for reliable updates
      const cap = document.createElement('p');
      cap.id = `capacity-${cssSafeId(name)}`;
      cap.innerHTML = `<strong>Capacity:</strong> ${data.participants.length} / ${data.max_participants}`;
      card.appendChild(cap);

      // Participants header
      const partHeader = document.createElement('p');
      partHeader.className = 'participants-header';
      partHeader.textContent = 'Participants:';
      card.appendChild(partHeader);

      // Participants list (bulleted)
      const ul = document.createElement('ul');
      ul.className = 'participants-list';
      ul.id = `participants-${cssSafeId(name)}`;
      if (data.participants && data.participants.length) {
        data.participants.forEach(p => {
          const li = document.createElement('li');
          li.textContent = p;
          ul.appendChild(li);
        });
      } else {
        const li = document.createElement('li');
        li.textContent = 'No participants yet';
        ul.appendChild(li);
      }
      card.appendChild(ul);

      return card;
    }

    function cssSafeId(name) {
      return name.replace(/\s+/g, '-').replace(/[^\w-]/g, '').toLowerCase();
    }

    function showMessage(text, type = 'info') {
      const box = document.getElementById('message');
      box.className = `message ${type}`;
      box.textContent = text;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 5000);
    }

    async function init() {
      activitiesData = await fetchActivities(); // assign to global
      const list = document.getElementById('activities-list');
      list.innerHTML = '';

      const select = document.getElementById('activity');
      // Clear existing options except placeholder
      select.querySelectorAll('option:not([value=""])').forEach(o => o.remove());

      Object.entries(activitiesData).forEach(([name, data]) => {
        const card = createActivityCard(name, data);
        list.appendChild(card);

        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const activity = document.getElementById('activity').value;
      if (!email || !activity) {
        showMessage('Please provide an email and select an activity.', 'error');
        return;
      }

      try {
        const res = await fetch(`/activities/${encodeURIComponent(activity)}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) {
          showMessage(data.detail || 'Signup failed', 'error');
          return;
        }

        showMessage(data.message || 'Signed up successfully', 'success');

        // Update participants list and capacity on the card using stable ids
        const ul = document.getElementById(`participants-${cssSafeId(activity)}`);
        if (ul) {
          ul.innerHTML = '';
          (data.participants || []).forEach(p => {
            const li = document.createElement('li');
            li.textContent = p;
            ul.appendChild(li);
          });
          // Update capacity text using the capacity id
          const capP = document.getElementById(`capacity-${cssSafeId(activity)}`);
          if (capP) {
            const max = activitiesData[activity] ? activitiesData[activity].max_participants : '';
            capP.innerHTML = `<strong>Capacity:</strong> ${data.participants.length} / ${max}`;
          }
        }

        // keep local copy in sync
        if (activitiesData[activity]) activitiesData[activity].participants = data.participants || [];
      } catch (err) {
        showMessage('Network error during signup', 'error');
      }
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
